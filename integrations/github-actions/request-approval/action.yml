name: Agent Tick Request Approval
description: Create an Agent Tick approval request from GitHub Actions and wait for a decision.
inputs:
  server:
    description: Agent Tick server URL
    required: true
  token:
    description: Agent Tick agent token
    required: true
  title:
    description: Approval title
    required: true
  body:
    description: Optional approval body
    required: false
    default: ""
  command:
    description: Optional command summary
    required: false
    default: ""
  timeout:
    description: How long to wait for a response
    required: false
    default: 10m
  expires-in:
    description: Request expiry duration
    required: false
    default: 5m
  requester:
    description: Requester name shown in Agent Tick
    required: false
    default: github-actions
  agent-id:
    description: Agent identifier shown in Agent Tick
    required: false
    default: github-actions
  project:
    description: Optional project display name
    required: false
    default: ""
  project-dir:
    description: Optional project directory grouping override
    required: false
    default: ""
  project-id:
    description: Optional project routing hint
    required: false
    default: ""
  team:
    description: Optional team routing hint
    required: false
    default: ""
  approval-policy:
    description: Optional approval policy routing hint
    required: false
    default: ""
  metadata:
    description: Optional JSON object of scalar metadata values
    required: false
    default: ""
outputs:
  request-id:
    description: Created Agent Tick request ID
    value: ${{ steps.request.outputs.request-id }}
  status:
    description: Final Agent Tick request status
    value: ${{ steps.request.outputs.status }}
  choice-id:
    description: Final response choice ID when present
    value: ${{ steps.request.outputs.choice-id }}
runs:
  using: composite
  steps:
    - name: Install agent-tick
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v agent-tick >/dev/null 2>&1; then
          curl -sSL https://raw.githubusercontent.com/self-deprecated/agent-tick/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi
    - name: Wait for approval
      id: request
      shell: bash
      env:
        INPUT_SERVER: ${{ inputs.server }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_BODY: ${{ inputs.body }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_EXPIRES_IN: ${{ inputs.expires-in }}
        INPUT_REQUESTER: ${{ inputs.requester }}
        INPUT_AGENT_ID: ${{ inputs.agent-id }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_PROJECT_DIR: ${{ inputs.project-dir }}
        INPUT_PROJECT_ID: ${{ inputs.project-id }}
        INPUT_TEAM: ${{ inputs.team }}
        INPUT_APPROVAL_POLICY: ${{ inputs.approval-policy }}
        INPUT_METADATA: ${{ inputs.metadata }}
      run: |
        set -euo pipefail
        events_file="${RUNNER_TEMP}/agent-tick-events.jsonl"
        args=(request --json-events --server "$INPUT_SERVER" --token "$INPUT_TOKEN" --title "$INPUT_TITLE" --timeout "$INPUT_TIMEOUT" --expires-in "$INPUT_EXPIRES_IN" --requester "$INPUT_REQUESTER" --agent-id "$INPUT_AGENT_ID")
        if [[ -n "$INPUT_BODY" ]]; then args+=(--body "$INPUT_BODY"); fi
        if [[ -n "$INPUT_COMMAND" ]]; then args+=(--command "$INPUT_COMMAND"); fi
        if [[ -n "$INPUT_PROJECT" ]]; then args+=(--project "$INPUT_PROJECT"); fi
        if [[ -n "$INPUT_PROJECT_DIR" ]]; then args+=(--project-dir "$INPUT_PROJECT_DIR"); fi
        if [[ -n "$INPUT_PROJECT_ID" ]]; then args+=(--project-id "$INPUT_PROJECT_ID"); fi
        if [[ -n "$INPUT_TEAM" ]]; then args+=(--team "$INPUT_TEAM"); fi
        if [[ -n "$INPUT_APPROVAL_POLICY" ]]; then args+=(--approval-policy "$INPUT_APPROVAL_POLICY"); fi
        if [[ -n "$INPUT_METADATA" ]]; then args+=(--metadata "$INPUT_METADATA"); fi

        set +e
        agent-tick "${args[@]}" >"$events_file"
        status_code=$?
        set -e

        python3 - "$events_file" "$GITHUB_OUTPUT" <<'PY'
        import json
        import pathlib
        import sys

        lines = [line.strip() for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.strip()]
        created = json.loads(lines[0]) if lines else {}
        terminal = json.loads(lines[-1]) if lines else {}
        response = terminal.get("response") or {}
        with open(sys.argv[2], "a", encoding="utf-8") as fh:
            fh.write(f"request-id={created.get('requestId', '')}\n")
            fh.write(f"status={terminal.get('status', '')}\n")
            fh.write(f"choice-id={response.get('choiceId', '')}\n")
        PY
        exit "$status_code"
