version: 2

before:
  hooks:
    - go mod tidy -C apps/server

builds:
  - id: agent-tick
    main: ./cmd/agent-tick
    dir: apps/server
    binary: agent-tick
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: self-deprecated
    name: agent-tick
  draft: false
  prerelease: auto

brews:
  - name: agent-tick
    repository:
      owner: self-deprecated
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/self-deprecated/agent-tick
    description: Agent tick — server heartbeat daemon and CLI
    license: MIT
    install: |
      bin.install "agent-tick"
    test: |
      system "#{bin}/agent-tick", "--version"

scoops:
  - name: agent-tick
    repository:
      owner: self-deprecated
      name: scoop-bucket
    directory: bucket
    homepage: https://github.com/self-deprecated/agent-tick
    description: Agent tick — server heartbeat daemon and CLI
    license: MIT
