name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  nix-pnpm-deps-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check fetchPnpmDeps hash
        run: nix run .#check-pnpm-deps-hash

  docker-selfhost-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate Compose config
        run: docker compose config

      - name: Run Docker self-host single-mode E2E
        run: pnpm test:e2e:docker:single

      - name: Run Docker self-host PostgreSQL E2E
        run: pnpm test:e2e:docker:postgres

      - name: Run Docker self-host PostgreSQL Clerk test-auth E2E
        run: pnpm test:e2e:docker:postgres-clerk-test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-selfhost-e2e-playwright-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

  typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Svelte admin check
        run: pnpm --filter agent-tick-admin check
