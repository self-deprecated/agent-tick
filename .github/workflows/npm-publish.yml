name: Publish npm CLI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run npm publish with --dry-run
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

jobs:
  publish-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter @self-deprecated/agent-tick build

      - name: Pack smoke test
        run: pnpm --filter @self-deprecated/agent-tick pack --pack-destination "$RUNNER_TEMP"

      - name: Agent Tick release sanction
        if: ${{ (github.event.inputs.dry-run || 'false') != 'true' }}
        env:
          AGENT_TICK_SERVER: ${{ secrets.AGENT_TICK_SERVER }}
          AGENT_TICK_TOKEN: ${{ secrets.AGENT_TICK_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changelog="https://github.com/${REPOSITORY}/releases/tag/${RELEASE_TAG}"
          node packages/cli/dist/index.js sanction \
            --title "Publish Agent Tick CLI ${RELEASE_TAG}?" \
            --body "Repository: ${REPOSITORY}\nTarget: npm @self-deprecated/agent-tick\nChangelog: ${changelog}\nCommit: ${COMMIT_SHA}" \
            --command "pnpm --filter @self-deprecated/agent-tick publish" \
            --choice-flag approve=production \
            --choice-flag approve=audit_relevant \
            --timeout 30m

      - name: Publish CLI to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry-run || 'false' }}
        run: |
          set -euo pipefail
          args=(--filter @self-deprecated/agent-tick publish --access public --provenance --no-git-checks)
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          pnpm "${args[@]}"
