name: Publish npm CLI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run npm publish with --dry-run
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

jobs:
  publish-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter @self-deprecated/agent-tick build

      - name: Pack smoke test
        run: pnpm --filter @self-deprecated/agent-tick pack --pack-destination "$RUNNER_TEMP"

      - name: Publish CLI to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry-run || 'false' }}
        run: |
          set -euo pipefail
          args=(--filter @self-deprecated/agent-tick publish --access public --provenance --no-git-checks)
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          pnpm "${args[@]}"
