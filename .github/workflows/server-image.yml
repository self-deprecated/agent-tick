name: Server image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/server-image.yml"
      - "apps/server/**"
      - "apps/admin/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke-test pull request image
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          image="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n 1)"
          container="agent-tick-server-image-smoke"
          docker rm -f "$container" >/dev/null 2>&1 || true
          docker run -d --name "$container" -p 8787:8787 \
            -e AGENT_TICK_MODE=single \
            -e AGENT_TICK_DATABASE_URL=file:/tmp/agent-tick-smoke.db \
            -e AGENT_TICK_DATABASE_MIGRATE_ON_START=true \
            "$image"
          trap 'docker logs "$container" || true; docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/healthz >/dev/null && curl -fsS http://127.0.0.1:8787/readyz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
