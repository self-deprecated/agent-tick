services:
  server:
    image: ${AGENT_TICK_IMAGE:-agent-tick/server:local}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      AGENT_TICK_MODE: ${AGENT_TICK_MODE:-single}
      AGENT_TICK_PUBLIC_URL: ${AGENT_TICK_PUBLIC_URL:-http://localhost:8787}
      AGENT_TICK_DATABASE_URL: file:/data/agent-tick.db
      AGENT_TICK_DATABASE_MIGRATE_ON_START: ${AGENT_TICK_DATABASE_MIGRATE_ON_START:-}
      AGENT_TICK_ADMIN_TOKEN: ${AGENT_TICK_ADMIN_TOKEN:-}
      AGENT_TICK_TOKEN: ${AGENT_TICK_TOKEN:-}
      AGENT_TICK_MAX_ACTIVE_MEMBERS: ${AGENT_TICK_MAX_ACTIVE_MEMBERS:-}
      AGENT_TICK_INVITE_EMAIL_WEBHOOK_URL: ${AGENT_TICK_INVITE_EMAIL_WEBHOOK_URL:-}
      AGENT_TICK_APPROVAL_NOTIFICATION_WEBHOOK_URL: ${AGENT_TICK_APPROVAL_NOTIFICATION_WEBHOOK_URL:-}
      AGENT_TICK_RATE_LIMIT_WINDOW_MS: ${AGENT_TICK_RATE_LIMIT_WINDOW_MS:-}
      AGENT_TICK_RATE_LIMIT_MAX_REQUESTS: ${AGENT_TICK_RATE_LIMIT_MAX_REQUESTS:-}
      AGENT_TICK_REDIS_URL: ${AGENT_TICK_REDIS_URL:-}
      AGENT_TICK_EVENT_BUS_BACKEND: ${AGENT_TICK_EVENT_BUS_BACKEND:-}
      AGENT_TICK_RATE_LIMIT_BACKEND: ${AGENT_TICK_RATE_LIMIT_BACKEND:-}
      AGENT_TICK_APPROVAL_RETENTION_DAYS: ${AGENT_TICK_APPROVAL_RETENTION_DAYS:-}
      AGENT_TICK_STATUS_UPDATE_RETENTION_DAYS: ${AGENT_TICK_STATUS_UPDATE_RETENTION_DAYS:-}
      AGENT_TICK_AUDIT_RETENTION_DAYS: ${AGENT_TICK_AUDIT_RETENTION_DAYS:-}
      AGENT_TICK_UNREGISTERED_DEVICE_RETENTION_DAYS: ${AGENT_TICK_UNREGISTERED_DEVICE_RETENTION_DAYS:-}
      AGENT_TICK_EXPIRED_INVITE_RETENTION_DAYS: ${AGENT_TICK_EXPIRED_INVITE_RETENTION_DAYS:-}
      AGENT_TICK_RETENTION_CLEANUP_ENABLED: ${AGENT_TICK_RETENTION_CLEANUP_ENABLED:-}
      AGENT_TICK_RETENTION_CLEANUP_INTERVAL_MINUTES: ${AGENT_TICK_RETENTION_CLEANUP_INTERVAL_MINUTES:-}
      AGENT_TICK_RETENTION_CLEANUP_LOCK_BACKEND: ${AGENT_TICK_RETENTION_CLEANUP_LOCK_BACKEND:-}
      AGENT_TICK_RETENTION_CLEANUP_LOCK_TTL_MS: ${AGENT_TICK_RETENTION_CLEANUP_LOCK_TTL_MS:-}
      AGENT_TICK_CLERK_PUBLISHABLE_KEY: ${AGENT_TICK_CLERK_PUBLISHABLE_KEY:-}
      AGENT_TICK_CLERK_SECRET_KEY: ${AGENT_TICK_CLERK_SECRET_KEY:-}
      AGENT_TICK_CLERK_AUTHORIZED_PARTIES: ${AGENT_TICK_CLERK_AUTHORIZED_PARTIES:-}
      AGENT_TICK_CLERK_JWT_KEY: ${AGENT_TICK_CLERK_JWT_KEY:-}
      AGENT_TICK_SESSION_SECRET: ${AGENT_TICK_SESSION_SECRET:-}
    ports:
      - "${AGENT_TICK_PORT:-8787}:8787"
    volumes:
      - agent_tick_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  agent_tick_data:
